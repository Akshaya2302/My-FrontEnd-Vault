<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="/register" method="POST">
      <fieldset>
        <legend>Personal Information</legend>
        <label for="fn"
          >First Name: <input type="text" id="fn" name="firstname" required
        /></label>
        <label for="ln"
          >Last Name: <input type="text" id="ln" name="lastname" required
        /></label>
        <label for="dob"
          >Date of Birth: <input type="date" id="dob" name="dob"
        /></label>
      </fieldset>

      <fieldset>
        <legend>Account Details</legend>
        <label for="em"
          >Email: <input type="email" id="em" name="email" required
        /></label>
        <label for="pw"
          >Password: <input type="password" id="pw" name="password" required
        /></label>
      </fieldset>

      <fieldset>
        <legend>Interests</legend>
        <input type="checkbox" id="c1" name="interest" value="sports" /><label
          for="c1"
          >Sports</label
        >
        <input type="checkbox" id="c2" name="interest" value="music" /><label
          for="c2"
          >Music</label
        >
        <input type="checkbox" id="c3" name="interest" value="coding" /><label
          for="c3"
          >Coding</label
        >
      </fieldset>

      <button type="submit">Create Account</button>
    </form>
  </body>
</html>
