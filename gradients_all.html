<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Ultimate CSS Gradients Vault</title>
    <link rel="stylesheet" href="style_gradients_all.css">
</head>
<body>

    <h1 class="title">CSS Gradients Mastery</h1>

    <div class="grid-container">
        <div class="card linear-card">
            <h3>Linear</h3>
            <p>linear-gradient(45deg, ...)</p>
        </div>

        <div class="card radial-card">
            <h3>Radial</h3>
            <p>radial-gradient(circle, ...)</p>
        </div>

        <div class="card conic-card-wheel">
            <h3>Conic Wheel</h3>
            <p>conic-gradient(...)</p>
        </div>

        <div class="card conic-card-pie">
            <h3>Conic Slices</h3>
            <p>Hard color stops</p>
        </div>
    </div>

</body>
</html>
