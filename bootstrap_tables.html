<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Tables Practice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">

    <div class="container bg-white p-4 rounded shadow">
        
        <h2 class="text-center text-primary mb-4">Class Schedule Table</h2>

        <table class="table table-striped table-bordered table-hover">
            <thead class="table-dark"> <tr>
                    <th>Subject</th>
                    <th>Classroom</th>
                    <th>Timing</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Computational Thinking</td>
                    <td>Lab 3</td>
                    <td>09:30 AM</td>
                </tr>
                <tr>
                    <td>Engineering Chemistry</td>
                    <td>Room 202</td>
                    <td>11:00 AM</td>
                </tr>
                <tr>
                    <td>AI & Machine Learning Intro</td>
                    <td>Seminar Hall</td>
                    <td>02:00 PM</td>
                </tr>
            </tbody>
        </table>

    </div>

</body>
</html>
