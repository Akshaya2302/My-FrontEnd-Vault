<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Images Practice</title>
    <!-- Official Link from your notes -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">

    <div class="container bg-white p-4 rounded shadow text-center">
        
        <h2 class="text-primary mb-5 text-uppercase">Bootstrap Image Utilities</h2>

        <div class="row g-4 justify-content-center">
            
            <!-- 1. Rounded Corners Layout Block -->
            <div class="col-md-4">
                <p class="fw-bold">Rounded Corners (`.rounded`)</p>
                <!-- Using a clean placeholder photo -->
                <img src="https://picsum.photos/200" class="rounded" alt="Rounded Example">
            </div>

            <!-- 2. Circular Shape Layout Block (Exact Pattern from your Unit Guide) -->
            <div class="col-md-4">
                <p class="fw-bold">Circular Image (`.rounded-circle`)</p>
                <!-- Exact class combination matching your document example -->
                <img src="https://picsum.photos/200" class="img-fluid rounded-circle" width="100" alt="Circle Example"> <!-- -->
            </div>

            <!-- 3. Thumbnail Layout Block -->
            <div class="col-md-4">
                <p class="fw-bold">Thumbnail Style (`.img-thumbnail`)</p>
                <img src="https://picsum.photos/200" class="img-thumbnail" alt="Thumbnail Example">
            </div>

        </div>

    </div>

</body>
</html>
