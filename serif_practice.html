<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Serif Font Practice</title>
    <link rel="stylesheet" href="style_serif.css">
</head>
<body>

    <h1 class="fallback-serif">This is System Serif</h1>
    <p class="preferred-serif">
        This paragraph prefers Georgia. If Georgia is missing from the system, it gracefully falls back to the default system serif font.
    </p>

</body>
</html>
