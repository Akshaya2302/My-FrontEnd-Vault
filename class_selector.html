<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Class Selector Practice</title>
    <link rel="stylesheet" href="style_class_selector.css" />
  </head>
  <body>
    <!-- This heading uses the highlight class -->
    <h1 class="highlight">Special Heading</h1>

    <!-- This paragraph also uses the highlight class -->
    <p class="highlight">
      This paragraph is highlighted because it has the class.
    </p>

    <!-- This paragraph has NO class, so it stays completely plain -->
    <p>This is just a normal, unstyled paragraph.</p>
  </body>
</html>
