<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap List Groups Practice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">

    <div class="container bg-white p-4 rounded shadow" style="max-width: 500px;">
        
        <h4 class="text-primary mb-3">Navigation Menu</h4>
        <ul class="list-group mb-4">
            <li class="list-group-item list-group-item-action">Home</li>
            <li class="list-group-item list-group-item-action">About</li>
            <li class="list-group-item list-group-item-action">Contact</li>
        </ul>
        
        <hr>

        <h4 class="text-secondary mb-3">System Tasks Status</h4>
        <ul class="list-group">
            <li class="list-group-item list-group-item-success">Success item - Database connected</li>
            <li class="list-group-item list-group-item-danger">Error item - Storage full warning</li>
        </ul>

    </div>

</body>
</html>
