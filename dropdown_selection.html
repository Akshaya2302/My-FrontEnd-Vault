<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

  <body>
    <! -- Dropdown Select -->
    <label for="city">Select City:</label>

      <option value="delhi" selected>Delhi</option>
      <option value="chennai">Chennai</option>
    </select>
  </body>
</html>
